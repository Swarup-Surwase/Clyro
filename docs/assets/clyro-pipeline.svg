<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 186" width="1200" height="186" fill="none">
  <defs>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .rail-dash { stroke-dasharray: 8 8; animation: railMove 2.2s linear infinite; }
      @keyframes railMove {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="186" rx="12" fill="#050505" />
  <rect x="0.75" y="0.75" width="1198.5" height="184.5" rx="11.25" stroke="#1B1D1F" stroke-width="1.5" />

  <!-- Header label -->
  <text x="28" y="30" class="mono" font-size="11" fill="#A8E6CF">INSIDE BROWSER VOLATILE RAM (CSP connect-src 'none')</text>
  <text x="1172" y="30" text-anchor="end" class="mono" font-size="11" fill="#737373">LOCAL WEB WORKER SUPPORT (&gt;40K CHARS)</text>

  <!-- Connecting rail behind nodes -->
  <line x1="115" y1="86" x2="1085" y2="86" stroke="#26282A" stroke-width="2" />
  <line class="rail-dash" x1="115" y1="86" x2="1085" y2="86" stroke="#A8E6CF" stroke-opacity="0.55" stroke-width="2" />

  <!-- Traveling mint pulse -->
  <circle r="4.5" fill="#A8E6CF">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 115 86 L 1085 86" />
  </circle>

  <!-- 6 Pipeline Stage Cards -->
  <g transform="translate(28, 50)">
    <rect width="174" height="76" rx="8" fill="#0C0D0E" stroke="#26282A" />
    <text x="14" y="23" class="mono" font-size="10.5" fill="#A8E6CF">01 INPUT</text>
    <text x="14" y="45" class="sans" font-size="13.5" font-weight="600" fill="#F5F5F5">Paste / TXT / CSV</text>
    <text x="14" y="63" class="mono" font-size="10" fill="#737373">File.text() • 5 MB cap</text>
  </g>

  <g transform="translate(222, 50)">
    <rect width="174" height="76" rx="8" fill="#0C0D0E" stroke="#26282A" />
    <text x="14" y="23" class="mono" font-size="10.5" fill="#A8E6CF">02 DETECT</text>
    <text x="14" y="45" class="sans" font-size="13.5" font-weight="600" fill="#F5F5F5">6 PII Scanners</text>
    <text x="14" y="63" class="mono" font-size="10" fill="#737373">Bounded linear regex</text>
  </g>

  <g transform="translate(416, 50)">
    <rect width="174" height="76" rx="8" fill="#111315" stroke="#A8E6CF" stroke-opacity="0.5" />
    <text x="14" y="23" class="mono" font-size="10.5" fill="#A8E6CF">03 VALIDATE</text>
    <text x="14" y="45" class="sans" font-size="13.5" font-weight="600" fill="#F5F5F5">Luhn &amp; IP Parser</text>
    <text x="14" y="63" class="mono" font-size="10" fill="#A3A3A3">Verhoeff + RFC 5952</text>
  </g>

  <g transform="translate(610, 50)">
    <rect width="174" height="76" rx="8" fill="#0C0D0E" stroke="#26282A" />
    <text x="14" y="23" class="mono" font-size="10.5" fill="#A8E6CF">04 TRANSFORM</text>
    <text x="14" y="45" class="sans" font-size="13.5" font-weight="600" fill="#F5F5F5">3 Redaction Modes</text>
    <text x="14" y="63" class="mono" font-size="10" fill="#737373">Overlap-free spans</text>
  </g>

  <g transform="translate(804, 50)">
    <rect width="174" height="76" rx="8" fill="#0C0D0E" stroke="#26282A" />
    <text x="14" y="23" class="mono" font-size="10.5" fill="#A8E6CF">05 AUDIT</text>
    <text x="14" y="45" class="sans" font-size="13.5" font-weight="600" fill="#F5F5F5">Zero-PII Metrics</text>
    <text x="14" y="63" class="mono" font-size="10" fill="#737373">Reconciled JSON/UI</text>
  </g>

  <g transform="translate(998, 50)">
    <rect width="174" height="76" rx="8" fill="#0C0D0E" stroke="#26282A" />
    <text x="14" y="23" class="mono" font-size="10.5" fill="#6DD6A4">06 EXPORT</text>
    <text x="14" y="45" class="sans" font-size="13.5" font-weight="600" fill="#F5F5F5">Neutral Blob Save</text>
    <text x="14" y="63" class="mono" font-size="10" fill="#737373">Safe CSV formula guard</text>
  </g>

  <!-- Hard privacy boundary footer -->
  <rect x="28" y="142" width="1144" height="28" rx="6" fill="#0C0D0E" stroke="#E87D85" stroke-opacity="0.35" stroke-dasharray="5 5" />
  <text x="600" y="160" text-anchor="middle" class="mono" font-size="11" fill="#E87D85">
    TRUST BOUNDARY — ZERO NETWORK UPLOADS • ZERO LOCALSTORAGE / INDEXEDDB PERSISTENCE • ZERO TELEMETRY
  </text>
</svg>
